<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Astralis">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161D3C"/>
      <stop offset="1" stop-color="#080A18"/>
    </linearGradient>
    <linearGradient id="a-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E3A8"/>
      <stop offset=".5" stop-color="#D9B96C"/>
      <stop offset="1" stop-color="#B68F3C"/>
    </linearGradient>
    <radialGradient id="a-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#D9B96C" stop-opacity=".5"/>
      <stop offset="1" stop-color="#D9B96C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#a-bg)" stroke="#D9B96C" stroke-opacity=".28" stroke-width="1"/>
  <circle cx="32" cy="32" r="19" fill="url(#a-glow)"/>
  <!-- tilted orbital ring -->
  <ellipse cx="32" cy="32" rx="22" ry="8.5" fill="none" stroke="url(#a-gold)" stroke-width="1.4" stroke-opacity=".6" transform="rotate(-24 32 32)"/>
  <!-- principal four-point star -->
  <path d="M32 8 L36.4 27.6 L56 32 L36.4 36.4 L32 56 L27.6 36.4 L8 32 L27.6 27.6 Z" fill="url(#a-gold)"/>
  <!-- accent sparkle + distant star -->
  <path d="M49.5 15 l1.4 4.1 4.1 1.4 -4.1 1.4 -1.4 4.1 -1.4 -4.1 -4.1 -1.4 4.1 -1.4 Z" fill="#F6E3A8" opacity=".92"/>
  <circle cx="15.5" cy="46.5" r="1.5" fill="#F6E3A8" opacity=".8"/>
</svg>
